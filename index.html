<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Currency Converter</title>
<style>
  * {
    box-sizing: border-box;
    font-family: "Trirong", serif;
  }
  body {
    margin: 0;
    font-family: "Trirong", serif;
    background-color: rgba(0, 255, 238, 0.327);
    color: black;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .converter-container {
    background: rgba(255, 255, 255, 0.965) ;
    border-radius: 20px;
    box-shadow: 1px 1px 5px black ,-1px -1px 5px black;
    max-width: 400px;
    width: 100%;
    height: 500px;
    padding: 2rem 2.5rem;
    text-align: center;
  }
  h1 {
    margin-bottom: 1.2rem;
    color: blue;
    font-weight: 600;
  }
  label {
    font-weight: 600;
    display: block;
    margin-top: 5px;
    margin-bottom: 6px;
    text-align: left;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 10px 14px;
    font-size: 1rem;
    border: 0px;
    border-bottom: 2px solid #939393;
    outline-offset: 2px;
    margin-bottom: 1rem;
    transition: border-color 0.3s;
  }
  select:focus, input[type="number"]:focus {
    border-color: black;
  }
  button.convert-btn {
    background-color: rgba(11, 11, 233, 0.771);
    color: #fff;
    border: none;
    border-radius: 20px;
    margin-top: 25px;
    padding: 12px 0;
    width: 100%;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button.convert-btn:hover {
    background-color:rgb(12, 165, 221);
  }
  .result {
    margin-top: 1.5rem;
    font-size: 1.25rem;
    font-weight: 600;
    min-height: 36px;
    color: rgb(147, 240, 9);
  }
  @media (max-width: 460px) {
    .converter-container {
      padding: 1.5rem 1.8rem;
    }
  }
</style>
</head>
<body>
  <div class="converter-container" role="main" aria-label="Currency Converter">
    <h1>Currency Converter</h1>
    <form id="converter-form">
      <label for="from-currency">From:</label>
      <select id="from-currency" aria-required="true" required>
        <option value="USD" selected>USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="INR">INR - Indian Rupee</option>
      </select>

      <label for="to-currency">To:</label>
      <select id="to-currency" aria-required="true" required>
        <option value="EUR">EUR - Euro</option>
        <option value="USD" selected>USD - US Dollar</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="INR">INR - Indian Rupee</option>
      </select>

      <label for="amount">Amount:</label>
      <input type="number" id="amount" min="0" step="any" placeholder="Enter amount" aria-required="true" required />

      <button type="submit" class="convert-btn" aria-label="Convert currency">Convert</button>
    </form>
    <div class="result" id="result" aria-live="polite"></div>
  </div>

<script>
  (() => {
      const exchangeRatesUSD = {
      USD: 1,
      EUR: 1.12,
      GBP: 1.30,
      JPY: 0.0081,
      INR: 0.013,
    };

    const form = document.getElementById('converter-form');
    const fromCurrency = document.getElementById('from-currency');
    const toCurrency = document.getElementById('to-currency');
    const amountInput = document.getElementById('amount');
    const resultDiv = document.getElementById('result');

    function convertCurrency(amount, from, to) {
      if (from === to) {
        return amount;
      }
      
      const amountInUSD = amount * exchangeRatesUSD[from];
      const convertedAmount = amountInUSD / exchangeRatesUSD[to];
      return convertedAmount;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(amountInput.value);
      const from = fromCurrency.value;
      const to = toCurrency.value;

      if (isNaN(amount) || amount < 0) {
        resultDiv.textContent = "Please enter a valid amount.";
        return;
      }
      if (from === to) {
        resultDiv.textContent = "Please select different currencies to convert.";
        return;
      }

      let converted = convertCurrency(amount, from, to);
      const formattedAmount = converted < 0.01 ? converted.toFixed(4) : converted.toFixed(2);

      resultDiv.textContent = `${amount} ${from} = ${formattedAmount} ${to}`;
    });
  })();
</script>
</body>
</html>
